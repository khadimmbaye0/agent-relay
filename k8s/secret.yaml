# Credentials shared by PostgreSQL and the relay.
#
# These are the same local-development defaults as compose.yaml so the two
# environments behave identically. `stringData` is stored unencrypted and is
# readable by anyone with API access: replace this with a real secret store
# (SealedSecrets, External Secrets, SOPS) before this cluster is shared, and
# never commit a production password here.
#
# RELAY_DATABASE_URL points at the in-cluster Service name. The relay image has
# no default that suits a container, so this key is what actually wires it up.
apiVersion: v1
kind: Secret
metadata:
  name: relay-database
  namespace: agent-relay
  labels:
    app.kubernetes.io/part-of: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: relay
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
